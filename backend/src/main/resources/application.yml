server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: vm-migration-assessment
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vmmigration}${DB_SSL:}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:9493}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:3000}
  gcp:
    project-id: ${GCP_PROJECT_ID:project-7a8d1679-ad3e-46db-bb2}
    default-region: ${GCP_DEFAULT_REGION:us-central1}
    default-zone: ${GCP_DEFAULT_ZONE:us-central1-a}
    default-network: ${GCP_DEFAULT_NETWORK:default}
    default-subnet: ${GCP_DEFAULT_SUBNET:}
    mock-mode: ${GCP_MOCK_MODE:false}
    max-concurrent-vms: ${GCP_MAX_CONCURRENT_VMS:5}
    cost-control:
      enforce-safety-limits: true
      allowed-machine-types: e2-micro,e2-small,e2-medium,e2-standard-2,e2-standard-4,n2-standard-2,n2-standard-4

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

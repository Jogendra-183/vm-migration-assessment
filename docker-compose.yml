version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vmmigration-postgres
    environment:
      POSTGRES_DB: vmmigration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-9493}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vmmigration"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vmmigration-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vmmigration-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: vmmigration
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-9493}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vmmigration-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vmmigration-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - vmmigration-network

volumes:
  pgdata:

networks:
  vmmigration-network:
    driver: bridge
